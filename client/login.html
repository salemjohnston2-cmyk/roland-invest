<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in</title>
<meta name="description" content="Log in" />
<link rel="stylesheet" href="/css/app.css" />
<link rel="stylesheet" href="/css/google-modal.css" />
</head>
<body>
<header class="top">
  <div class="wrap-narrow">
    <a class="brand" href="index.html" data-brand><em>Roland</em> Invests</a>
    <a class="top-link" href="signup.html">Create account</a>
  </div>
</header>

<main class="top-align">
  <div class="wrap-narrow auth-shell">
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue investing.</p>

    <div class="banner error" id="errorBanner"></div>

    <button type="button" class="btn btn-google" id="googleLogin">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.16 6.65 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="divider">or log in with email</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email or phone number</label>
        <input type="text" id="email" autocomplete="username" required />
        <div class="field-error">Enter your email or phone number.</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <div class="field-error">Enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Log in</button>
    </form>

    <p class="foot-note">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
</main>

<footer>
  <div class="wrap-narrow">
    <span data-copyright>&copy; 2026 Roland Invests</span>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/format.js"></script>
<script src="/js/api.js"></script>
<script src="/js/site-meta.js"></script>
<script src="/js/site-brand.js"></script>
<script src="/js/google-modal.js"></script>
<script>
applySiteMeta("Log in");

const errorBanner = document.getElementById("errorBanner");
function showError(msg){ errorBanner.textContent = msg; errorBanner.classList.add("show"); }
function hideError(){ errorBanner.classList.remove("show"); }

// Google (fake SSO)
document.getElementById("googleLogin").addEventListener("click", function () {
  googleModal.open();
});

// Email login
document.getElementById("loginForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  hideError();

  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const email = emailEl.value.trim();
  const password = passEl.value;

  let valid = true;
  emailEl.closest(".field").classList.toggle("invalid", !email); if (!email) valid = false;
  passEl.closest(".field").classList.toggle("invalid", !password); if (!password) valid = false;
  if (!valid) return;

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Logging in…";

  try {
    const res = await api.login({ email, password });
    api.setToken(res.token);
    window.location.href = "dashboard.html";
  } catch (err) {
    showError(err.message || "Something went wrong. Please try again.");
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});
</script>
</body>
</html>
