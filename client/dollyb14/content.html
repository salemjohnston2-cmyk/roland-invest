<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Site content</title>
<link rel="stylesheet" href="/css/admin.css" />
<style>
  .content-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px 22px;margin-bottom:12px;}
  .content-card .key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;}
  .content-card .label{font-size:14px;font-weight:600;margin-bottom:10px;}
  .content-card input, .content-card textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:5px;
    font-family:inherit;font-size:14px;color:var(--text);outline:none;box-sizing:border-box;
  }
  .content-card textarea{min-height:64px;resize:vertical;}
  .content-card input:focus, .content-card textarea:focus{border-color:var(--gold);}
  .content-card .row{display:flex;gap:10px;align-items:center;margin-top:10px;}
  .content-card .ok{font-size:12.5px;color:var(--green);display:none;}
  .content-card .ok.show{display:inline;}
  .hint{color:var(--text-muted);font-size:13px;margin-bottom:20px;}
</style>
</head>
<body>
<div class="admin-topbar">
  <span class="admin-brand"><em>Roland</em> Invests · Admin</span>
  <nav class="admin-nav">
    <a href="/dollyb14/dashboard.html">Overview</a>
    <a href="/dollyb14/users.html">Users</a>
    <a href="/dollyb14/transactions.html">Transactions</a>
    <a href="/dollyb14/kyc.html">KYC</a>
    <a href="/dollyb14/payments.html">Payments</a>
    <a href="/dollyb14/stocks.html">Stocks</a>
    <a href="/dollyb14/bank-details.html">Bank details</a>
    <a href="/dollyb14/content.html" class="active">Site content</a>
    <a href="/dollyb14/activity.html">Activity</a>
  </nav>
  <span class="admin-user">Signed in as <strong id="adminName">—</strong>
    <button id="logoutBtn">Log out</button>
  </span>
</div>

<div class="admin-wrap">
  <h1 class="admin-h1">Site content</h1>
  <p class="hint">Change any string here. Changes appear on public pages on next page load (up to 60s cache).</p>

  <div id="contentWrap"></div>
</div>

<script src="/js/config.js"></script>
<script src="/js/format.js"></script>
<script src="/js/api.js"></script>
<script src="/js/admin-guard.js"></script>
<script>
const LABELS = {
  "brand.name": "Brand name",
  "landing.headline": "Landing — headline",
  "landing.subhead": "Landing — subhead",
  "landing.fineprint": "Landing — fine print",
  "signup.subhead": "Signup — subhead",
  "login.subhead": "Login — subhead",
  "buy.transfer.instructions": "Buy — transfer instructions",
  "deposit.transfer.instructions": "Deposit — transfer instructions",
  "withdraw.timing_message": "Withdraw — timing message",
  "footer.copyright": "Footer — copyright",
};
const LONG_KEYS = new Set(["landing.subhead","landing.fineprint","buy.transfer.instructions","deposit.transfer.instructions"]);

window.addEventListener("admin:ready", async function (e) {
  document.getElementById("adminName").textContent = e.detail.username;
  load();
});
document.getElementById("logoutBtn").addEventListener("click", async function () {
  try { await api.adminLogout(); } catch (_) {}
  api.setToken(null);
  window.location.href = "/dollyb14/index.html";
});

async function load() {
  const wrap = document.getElementById("contentWrap");
  wrap.innerHTML = "";
  try {
    const { content } = await api.adminContent();
    content.forEach(row => {
      const el = document.createElement("div");
      el.className = "content-card";
      const isLong = LONG_KEYS.has(row.key);
      el.innerHTML = `
        <div class="key"></div>
        <div class="label"></div>
        ${isLong
          ? '<textarea></textarea>'
          : '<input type="text" />'}
        <div class="row">
          <button class="btn-a primary" data-save>Save</button>
          <span class="ok">Saved</span>
        </div>`;
      el.querySelector(".key").textContent = row.key;
      el.querySelector(".label").textContent = LABELS[row.key] || row.key;
      const field = el.querySelector("input, textarea");
      field.value = row.value;

      const btn = el.querySelector("[data-save]");
      const ok = el.querySelector(".ok");
      btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "Saving…";
        try {
          await api.adminUpdateContent(row.key, field.value);
          ok.textContent = "Saved";
          ok.classList.add("show");
          setTimeout(() => ok.classList.remove("show"), 2000);
        } catch (e) { alert(e.message); }
        finally { btn.disabled = false; btn.textContent = "Save"; }
      });

      wrap.appendChild(el);
    });
  } catch (_) {}
}
</script>
</body>
</html>
